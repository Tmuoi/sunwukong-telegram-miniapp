<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sun Wukong - Telegram Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .user {
      text-align: center;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #2481cc;
      color: white;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>🐒 Sun Wukong</h1>

      <div class="user">
        <p id="welcome">Đang tải thông tin...</p>
      </div>

      <button id="playButton">
        Bắt đầu chơi
      </button>

      <div id="status">
        Mini App đang khởi động...
      </div>

    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user) {
      const name =
        user.first_name ||
        user.username ||
        "Người chơi";

      document.getElementById("welcome").textContent =
        "Xin chào, " + name + " 👋";

      document.getElementById("status").textContent =
        "Mini App đã kết nối Telegram.";
    } else {
      document.getElementById("welcome").textContent =
        "Xin chào người chơi 👋";

      document.getElementById("status").textContent =
        "Đang chạy ở chế độ trình duyệt.";
    }

    document.getElementById("playButton").addEventListener("click", () => {
      document.getElementById("status").textContent =
        "🎮 Trò chơi đang được khởi động...";
    });
  </script>

</body>
  </html>
