<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sun Wukong - Telegram Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .user {
      text-align: center;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #2481cc;
      color: white;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>🐒 Sun Wukong</h1>

      <div class="user">
        <p id="welcome">Đang tải thông tin...</p>
      </div>

      <button id="playButton">
        Bắt đầu chơi
      </button>

      <div id="status">
        Mini App đang khởi động...
      </div>

    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    // URL Render API của bạn
    const API_URL = "https://TEN-APP-CUA-BAN.onrender.com";

    const statusEl = document.getElementById("status");
    const welcomeEl = document.getElementById("welcome");
    const playButton = document.getElementById("playButton");

    // Dữ liệu chỉ dùng để hiển thị giao diện
    const unsafeUser = tg.initDataUnsafe?.user;

    if (unsafeUser) {
        const name =
            unsafeUser.first_name ||
            unsafeUser.username ||
            "Người chơi";

        welcomeEl.textContent = "Xin chào, " + name + " 👋";
        statusEl.textContent = "Đang kết nối máy chủ...";
    } else {
        welcomeEl.textContent = "Xin chào người chơi 👋";
        statusEl.textContent = "Không tìm thấy dữ liệu Telegram.";
    }

    // Bắt đầu game
    playButton.addEventListener("click", async () => {
        playButton.disabled = true;
        statusEl.textContent = "⏳ Đang tải dữ liệu người chơi...";

        try {
            // QUAN TRỌNG:
            // Gửi initData thật của Telegram.
            // Không gửi initDataUnsafe để server xác thực.
            const initData = tg.initData;

            if (!initData) {
                throw new Error("Không có Telegram initData");
            }

            const response = await fetch(API_URL + "/api/player", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    initData: initData
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(
                    result.message || "Không thể tải dữ liệu người chơi"
                );
            }

            console.log("PLAYER:", result.player);

            statusEl.textContent =
                "🎮 Chào mừng! Dữ liệu người chơi đã được tải.";

            // Sau này chúng ta sẽ chuyển sang màn hình game ở đây.
            // Ví dụ:
            // showGame(result.player);

        } catch (error) {
            console.error("Lỗi:", error);

            statusEl.textContent =
                "❌ Không thể kết nối máy chủ. Vui lòng thử lại.";

            playButton.disabled = false;
        }
    });
  </script>

</body>
  </html>
